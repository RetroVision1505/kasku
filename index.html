<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasku</title>
<meta name="description" content="Pencatat keuangan pribadi. Data tersimpan di perangkatmu.">
<meta name="theme-color" content="#F8F5FF">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="jakarta.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Terapkan tema pilihan sebelum render pertama supaya tidak berkedip. */
try {
  var d = JSON.parse(localStorage.getItem('ft:data') || '{}');
  var t = d && d.settings && d.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url(jakarta.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}

:root{
  --bg:#F8F5FF; --surface:#FFFFFF; --surface2:#EEE9FB;
  --ink:#2A2347; --muted:#6B6492; --line:rgba(42,35,71,.09);
  --acc:#7B5CF0; --acc-ink:#FFFFFF; --acc-soft:#E6DEFF; --focus:#7B5CF0;
  --in:#17774F; --in-bg:#D6F2E6; --out:#C73F2D; --out-bg:#FFE0DA;
  --h1:#E0D5FF; --h2:#BEA9FF; --hero-ink:#2B1E5E; --blob:rgba(255,255,255,.3); --chip:rgba(255,255,255,.6);
  --w1:#CFF0E3; --w2:#FFD9CB; --w3:#CFE5FF; --w4:#FFF0B6; --w-ink:#2A2347;
  --nav-bg:#FFFFFF; --nav-shadow:0 14px 34px -12px rgba(60,40,140,.35);
  --card-shadow:0 8px 22px -14px rgba(60,40,140,.3);
  --scrim:rgba(24,16,56,.5); --toast-bg:#2A2347; --toast-ink:#F1EDFF; --toast-act:#C9B8FF;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px; --nav-gap:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17132B; --surface:#221C3D; --surface2:#2D2650;
    --ink:#F1EDFF; --muted:#A9A1CE; --line:rgba(220,210,255,.12);
    --acc:#9B84FF; --acc-ink:#1B1038; --acc-soft:#3A3070; --focus:#B7A6FF;
    --in:#7BE0B0; --in-bg:rgba(111,211,168,.15); --out:#FF9B8A; --out-bg:rgba(255,143,126,.15);
    --h1:#5240A3; --h2:#3A2B7E; --hero-ink:#F5F1FF; --blob:rgba(255,255,255,.08); --chip:rgba(255,255,255,.16);
    --w1:#1F4A3F; --w2:#5A3A38; --w3:#2A4670; --w4:#5A5028; --w-ink:#F1EDFF;
    --nav-bg:#221C3D; --nav-shadow:0 14px 34px -12px rgba(0,0,0,.6); --card-shadow:0 8px 22px -14px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.62); --toast-bg:#3B3269;
  }
}
:root[data-theme="dark"]{
  --bg:#17132B; --surface:#221C3D; --surface2:#2D2650;
  --ink:#F1EDFF; --muted:#A9A1CE; --line:rgba(220,210,255,.12);
  --acc:#9B84FF; --acc-ink:#1B1038; --acc-soft:#3A3070; --focus:#B7A6FF;
  --in:#7BE0B0; --in-bg:rgba(111,211,168,.15); --out:#FF9B8A; --out-bg:rgba(255,143,126,.15);
  --h1:#5240A3; --h2:#3A2B7E; --hero-ink:#F5F1FF; --blob:rgba(255,255,255,.08); --chip:rgba(255,255,255,.16);
  --w1:#1F4A3F; --w2:#5A3A38; --w3:#2A4670; --w4:#5A5028; --w-ink:#F1EDFF;
  --nav-bg:#221C3D; --nav-shadow:0 14px 34px -12px rgba(0,0,0,.6); --card-shadow:0 8px 22px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.62); --toast-bg:#3B3269;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--f);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:12px}

.app{max-width:520px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(var(--nav-h) + var(--nav-gap) + env(safe-area-inset-bottom) + 44px)}

/* ---------- Header ---------- */
.top{padding:10px 0 18px}
.top .date{font-size:14px;font-weight:600;color:var(--muted)}
.top h1{font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-.025em;margin-top:2px}

/* ---------- Kartu total saldo ---------- */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 24px;color:var(--hero-ink);
  background:linear-gradient(145deg,var(--h1),var(--h2));box-shadow:var(--card-shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--blob);pointer-events:none}
.hero::before{width:170px;height:170px;right:-46px;top:-60px}
.hero::after{width:100px;height:100px;right:46px;bottom:-52px}
.hero>*{position:relative;z-index:1}
.hero.enter{animation:pop .55s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.hero-label{font-size:15px;font-weight:700;opacity:.78}
.hero-amount{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.hero-amount .cur{font-size:20px;font-weight:700;opacity:.8}
.hero-amount .num{font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-.035em}
.hero-amount.md .num{font-size:34px} .hero-amount.sm .num{font-size:27px}
.chip{display:inline-block;margin-top:12px;padding:6px 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700}

/* ---------- Pemasukan / pengeluaran ---------- */
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.fc{border-radius:26px;padding:15px 15px 16px}
.fc.in{background:var(--in-bg)} .fc.out{background:var(--out-bg)}
.fi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin-bottom:11px;color:#fff}
.fc.in .fi{background:var(--in)} .fc.out .fi{background:var(--out)}
:root[data-theme="dark"] .fi{color:#17132B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fi{color:#17132B}}
.fi svg{width:17px;height:17px}
.fk{font-size:13px;font-weight:700;color:var(--muted)}
.fv{font-size:18px;font-weight:800;letter-spacing:-.015em;margin-top:1px}
.fc.in .fv{color:var(--in)} .fc.out .fv{color:var(--out)}

/* ---------- Seksi ---------- */
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sec-head .meta{font-size:13px;font-weight:700;color:var(--muted)}

.wr{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scroll-snap-type:x proximity;scroll-padding-inline:20px;scrollbar-width:none}
.wr::-webkit-scrollbar{display:none}
.wc{flex:none;width:156px;height:104px;border-radius:26px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;
  color:var(--w-ink);scroll-snap-align:start}
.wc:nth-child(4n+1){background:var(--w1)} .wc:nth-child(4n+2){background:var(--w2)}
.wc:nth-child(4n+3){background:var(--w3)} .wc:nth-child(4n+4){background:var(--w4)}
.wi{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.62);display:grid;place-items:center;font-size:18px}
:root[data-theme="dark"] .wi{background:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wi{background:rgba(255,255,255,.14)}}
.wn{font-size:13px;font-weight:700;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}

/* ---------- Kondisi kosong ---------- */
.empty{display:flex;flex-direction:column;align-items:flex-start;padding:22px 20px 22px;border-radius:28px;background:var(--surface);box-shadow:var(--card-shadow)}
.eb{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:29px;margin-bottom:14px}
.empty h3{font-size:17px;font-weight:800;letter-spacing:-.015em}
.empty p{margin-top:5px;color:var(--muted);font-size:15px;font-weight:500;max-width:38ch}
.soon{display:inline-block;margin-top:14px;padding:6px 13px;border-radius:999px;background:var(--acc-soft);color:var(--ink);font-size:13px;font-weight:700}

/* ---------- Banner ---------- */
.notice{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;padding:13px 16px;
  border-radius:22px;background:var(--w4);color:var(--w-ink);font-size:14px;font-weight:500}
.notice b{font-weight:800}

/* ---------- Kontrol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;
  border-radius:999px;background:var(--surface2);font-size:15px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.small{min-height:38px;padding:0 15px;font-size:14px}
.btn.danger{background:var(--out-bg);color:var(--out)}
.btn.danger-fill{background:var(--out);color:#fff}
:root[data-theme="dark"] .btn.danger-fill{color:#2A0F0B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger-fill{color:#2A0F0B}}
.btn:disabled{opacity:.45}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--surface2)}
.seg button{min-height:38px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.seg.full{display:grid;width:100%;margin-bottom:16px}
.seg.full button{min-height:42px}

/* ---------- Pengaturan ---------- */
.group{margin-top:24px}
.group:first-of-type{margin-top:0}
.group>h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.card{background:var(--surface);border-radius:28px;padding:4px 18px;box-shadow:var(--card-shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:12px}
.row.stack .seg{display:grid;width:100%}
.row .t{font-size:16px;font-weight:700}
.row .d{font-size:14px;color:var(--muted);margin-top:2px;font-weight:500}
.row .r{flex:none}
.foot{margin-top:26px;font-size:13px;color:var(--muted);max-width:42ch;font-weight:500}

/* ---------- Transaksi & analisis ---------- */
.monthbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px}
.monthbar .m{font-size:18px;font-weight:800;letter-spacing:-.02em}
.monthbar button{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:var(--card-shadow)}
.monthbar button:disabled{opacity:.55}
.ghost{display:flex;align-items:flex-end;gap:12px;height:130px;padding:20px 22px 0;margin-bottom:16px;border-radius:28px;background:var(--surface);box-shadow:var(--card-shadow)}
.ghost i{flex:1;border-radius:12px 12px 0 0}
.ghost i:nth-child(1){height:44%;background:var(--w1)} .ghost i:nth-child(2){height:78%;background:var(--w2)}
.ghost i:nth-child(3){height:34%;background:var(--w3)} .ghost i:nth-child(4){height:92%;background:var(--acc-soft)}
.ghost i:nth-child(5){height:58%;background:var(--w4)}

/* ---------- Navigasi pil melayang ---------- */
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-gap) + env(safe-area-inset-bottom));
  width:min(calc(100% - 28px),492px);height:var(--nav-h);border-radius:999px;background:var(--nav-bg);box-shadow:var(--nav-shadow)}
.nav ul{list-style:none;margin:0;padding:0 10px;height:100%;display:flex;align-items:center;justify-content:space-around}
.nav a{display:flex;align-items:center;gap:7px;height:46px;min-width:46px;padding:0 13px;border-radius:999px;justify-content:center;
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;transition:background .2s,color .2s}
.nav a svg{width:23px;height:23px;flex:none}
.nav a[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}

.fab{position:fixed;z-index:21;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  right:max(20px,calc(50% - 246px + 6px));bottom:calc(var(--nav-h) + var(--nav-gap) + env(safe-area-inset-bottom) + 14px);
  background:var(--acc);color:var(--acc-ink);box-shadow:0 14px 26px -10px var(--acc);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:27px;height:27px}
.fab[hidden]{display:none}

/* ---------- Sheet & toast ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:transparent;transition:background .26s}
.sheet-wrap[hidden]{display:none}
.sheet-wrap.open{background:var(--scrim)}
.sheet{width:min(100%,520px);max-height:88dvh;overflow:auto;background:var(--surface);border-radius:32px 32px 0 0;
  padding:10px 24px calc(env(safe-area-inset-bottom) + 26px);transform:translateY(100%);
  transition:transform .32s cubic-bezier(.2,.9,.25,1.05);outline:none}
.sheet-wrap.open .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 18px}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-.025em}
.sheet-msg{margin-top:10px;color:var(--muted);font-size:15.5px;font-weight:500}
.sheet-msg p+p{margin-top:10px}
.sheet-actions{display:flex;gap:10px;margin-top:24px}
.sheet-actions .btn{flex:1;min-height:50px}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(var(--nav-h) + var(--nav-gap) + env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;
  max-width:min(92vw,460px);padding:13px 18px;border-radius:20px;background:var(--toast-bg);color:var(--toast-ink);font-size:14.5px;font-weight:600;
  transition:opacity .2s,transform .28s cubic-bezier(.2,.9,.25,1.1);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:800;color:var(--toast-act);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Tahap 2: daftar, formulir, dompet ---------- */
.lnk{text-decoration:none;color:var(--acc)}
.empty .cta{margin-top:16px}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 8px}
.txl{background:var(--surface);border-radius:26px;padding:2px 14px;box-shadow:var(--card-shadow)}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.ti{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex:none}
.t-in{background:var(--w1)} .t-out{background:var(--w2)} .t-tr{background:var(--w3)}
.tm{flex:1;min-width:0;display:flex;flex-direction:column}
.tn{font-size:15px;font-weight:700}
.ts{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:15px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.ta.in{color:var(--in)} .ta.out{color:var(--out)}
.sheet .txl{box-shadow:none;background:var(--surface2);padding:2px 12px}
.sheet .txl .tx{border-color:var(--line)}

.wc{text-align:left;border:0;font:inherit}
.wc>span:last-child{display:flex;flex-direction:column;min-width:0}
.wc .wn{display:block}
.wc.add{background:transparent!important;border:2px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:14px;flex-direction:column}
.wc.add .plus{font-size:28px;line-height:1;font-weight:600}

.fld{margin-top:18px}
.fld>span,.fld>label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.fld input[type=text],.fld input[type=date]{width:100%;min-height:52px;padding:0 16px;border-radius:18px;border:2px solid transparent;background:var(--surface2);color:var(--ink);font:600 16px var(--f);-webkit-appearance:none;appearance:none}
.fld input:focus,.amt:focus-within{outline:none;border-color:var(--acc)}
.amt{display:flex;align-items:baseline;gap:8px;padding:12px 18px;border-radius:22px;background:var(--surface2);border:2px solid transparent}
.amt b{font-size:20px;font-weight:700;color:var(--muted)}
.amt input{flex:1;min-width:0;background:none;border:0;font:800 34px/1.2 var(--f);letter-spacing:-.03em;color:var(--ink);padding:0;outline:none}
.amt.sm input{font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:42px;padding:0 15px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.pick[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.em{aspect-ratio:1;border-radius:16px;background:var(--surface2);font-size:22px;display:grid;place-items:center}
.em[aria-pressed="true"]{background:var(--acc-soft);box-shadow:0 0 0 3px var(--acc)}
.hint{margin-top:8px;font-size:13.5px;color:var(--muted);font-weight:500}
.sheet>#sheetBody>.hint{margin:8px 0 0}
.err{min-height:20px;margin-top:14px;font-size:14px;font-weight:700;color:var(--out)}
.seg button:disabled{opacity:.5}
.sheet .seg.full{margin-top:14px}
.sheet h2+.seg.full{margin-top:16px}

/* ---------- Tahap 3: analisis & budget ---------- */
:root{--c-in:#2a78d6;--c-out:#eb6834;--warn:#C77F00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-in:#3987e5;--c-out:#d95926;--warn:#F2B33D}}
:root[data-theme="dark"]{--c-in:#3987e5;--c-out:#d95926;--warn:#F2B33D}
.net{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:12px;padding:14px 18px;border-radius:22px;background:var(--surface);box-shadow:var(--card-shadow)}
.net .k{font-size:14px;font-weight:700;color:var(--muted)}
.net .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.net .v.pos{color:var(--in)} .net .v.neg{color:var(--out)}
.panel{padding:18px 18px 16px;border-radius:28px;background:var(--surface);box-shadow:var(--card-shadow)}
.rk+.rk{margin-top:16px}
.rk-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:700}
.rk-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-n span{margin-right:7px}
.rk-v{white-space:nowrap;font-weight:800}
.rk-v small{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:6px}
.rk-b{height:10px;margin-top:7px;border-radius:999px;background:var(--surface2);overflow:hidden}
.rk-b i{display:block;height:100%;border-radius:999px;background:var(--c-out)}
.legend{display:flex;gap:18px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.in{background:var(--c-in)} .sw.out{background:var(--c-out)}
.trend{display:block;width:100%;height:auto;overflow:visible}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend text{fill:var(--muted);font:600 11px var(--f)}
.trend text.sel{fill:var(--ink);font-weight:800}
.trend .hl{fill:var(--acc-soft);opacity:.55}
.trend .b-in{fill:var(--c-in)} .trend .b-out{fill:var(--c-out)}
.trend .hit{fill:transparent;cursor:pointer}
.readout{margin-top:10px;font-size:13.5px;font-weight:700}
.readout span{color:var(--muted);font-weight:600}
details.tbl{margin-top:12px;font-size:13.5px}
details.tbl summary{cursor:pointer;font-weight:700;color:var(--acc);min-height:32px;display:flex;align-items:center}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px}
details.tbl th,details.tbl td{padding:7px 0;border-bottom:1px solid var(--line);text-align:right;font-weight:600}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
details.tbl th{color:var(--muted);font-weight:700}
.mt{--m:var(--in)} .mt.warn{--m:var(--warn)} .mt.bad{--m:var(--out)}
.mt+.mt{margin-top:18px}
.mt-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:700}
.mt-h .rk-v small{margin-left:0}
.mt-b{height:10px;margin-top:7px;border-radius:999px;background:color-mix(in srgb,var(--m) 20%,var(--surface2));overflow:hidden}
.mt-b i{display:block;height:100%;border-radius:999px;background:var(--m)}
.mt-s{margin-top:6px;font-size:13px;font-weight:600;color:var(--muted)}
.mt-s b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;margin-right:6px;background:var(--m);color:#fff;font-size:11px;font-weight:800;vertical-align:1px}
:root[data-theme="dark"] .mt-s b{color:#1B1038}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mt-s b{color:#1B1038}}
.panel .cta{margin-top:18px;width:100%}
</style>
</head>
<body>
<div class="app" id="app">
  <main id="view" tabindex="-1"></main>
</div>

<button class="fab" id="fab" data-a="add" aria-label="Catat transaksi">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" aria-label="Menu utama">
  <ul id="nav"></ul>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="grab" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
   Kasku: fondasi (Tahap 1) dengan tampilan "Lilac lembut".
   Skema data v1. Semua data hidup di localStorage perangkat ini.
   ===================================================================== */
const APP = 'kasku', SCHEMA = 1, VERSION = '0.4.0';
const KEY = 'ft:data', PREV = 'ft:prev', CORRUPT = 'ft:corrupt';
const LISTS = ['wallets', 'categories', 'transactions', 'budgets', 'goals', 'debts'];

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const nowISO = () => new Date().toISOString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 });
const rupiah = n => 'Rp ' + nf.format(Math.round(n || 0));
const fmtDateTime = iso => new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const ymd = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };

/* ---------- penyimpanan ---------- */
let storageOk = true;
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { storageOk = false; return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

const DEFAULT_CATS = [
  ['Makan & minum', 'out', '🍜'], ['Transportasi', 'out', '🚌'], ['Belanja', 'out', '🛍️'],
  ['Tagihan', 'out', '🧾'], ['Hiburan', 'out', '🎬'], ['Kesehatan', 'out', '💊'],
  ['Pendidikan', 'out', '📚'], ['Lainnya', 'out', '✨'],
  ['Gaji', 'in', '💼'], ['Bonus', 'in', '⭐'], ['Hadiah', 'in', '🎁'], ['Pemasukan lain', 'in', '💰']
];
const ICON_KEYS = { utensils: '🍜', car: '🚌', bag: '🛍️', receipt: '🧾', film: '🎬', heart: '💊', book: '📚', dots: '✨', briefcase: '💼', star: '⭐', gift: '🎁' };

function fresh() {
  const t = nowISO();
  return {
    app: APP, version: SCHEMA,
    meta: { createdAt: t, updatedAt: t, lastBackupAt: null },
    settings: { theme: 'auto' },
    wallets: [],            // {id,name,type:'cash'|'bank'|'ewallet',openingBalance,createdAt}
    categories: DEFAULT_CATS.map(([name, type, icon]) => ({ id: uid(), name, type, icon })),
    transactions: [],       // {id,date,type:'in'|'out'|'transfer',amount,walletId,toWalletId?,categoryId?,note}
    budgets: [],            // {id,categoryId,limit}
    goals: [],              // {id,name,target,saved,deadline?}
    debts: []               // {id,party,kind:'owe'|'lent',total,paid,dueDate?}
  };
}
function validate(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'File ini bukan data yang valid.';
  if (d.app !== APP) return 'File ini bukan cadangan Kasku.';
  if (typeof d.version !== 'number' || d.version > SCHEMA) return 'Cadangan ini dibuat oleh versi aplikasi yang lebih baru.';
  for (const k of LISTS) if (!Array.isArray(d[k])) return `Data "${k}" tidak ditemukan di file ini.`;
  return null;
}
function normalize(d) {
  const out = { app: APP, version: SCHEMA };
  out.meta = Object.assign({ createdAt: nowISO(), updatedAt: nowISO(), lastBackupAt: null }, d.meta || {});
  out.settings = Object.assign({ theme: 'auto' }, d.settings || {});
  for (const k of LISTS) out[k] = d[k];
  out.categories = out.categories.map(c => (c && ICON_KEYS[c.icon]) ? Object.assign({}, c, { icon: ICON_KEYS[c.icon] }) : c);
  return out;
}
function load() {
  const raw = lsGet(KEY);
  if (raw) {
    try { const d = JSON.parse(raw); if (!validate(d)) return normalize(d); } catch (e) {}
    lsSet(CORRUPT, raw); /* jangan timpa data rusak tanpa jejak */
  }
  const d = fresh(); persist(d); return d;
}
function persist(d = db) {
  const ok = lsSet(KEY, JSON.stringify(d));
  if (!ok) { storageOk = false; toast('Data gagal disimpan. Penyimpanan penuh atau diblokir.'); }
  return ok;
}
function commit(fn) { fn(db); db.meta.updatedAt = nowISO(); persist(); }
function counts(d) { const o = {}; for (const k of LISTS) o[k] = d[k].length; return o; }
function hasUserData(d) { return ['wallets', 'transactions', 'budgets', 'goals', 'debts'].some(k => d[k].length > 0); }
function daysSinceBackup() { return db.meta.lastBackupAt ? Math.floor((Date.now() - new Date(db.meta.lastBackupAt)) / 864e5) : null; }
function needsBackup() { if (!hasUserData(db)) return false; const n = daysSinceBackup(); return n === null || n >= 7; }
function byteSize() { try { return new Blob([JSON.stringify(db)]).size; } catch (e) { return 0; } }

let db = load();

/* ---------- ikon ---------- */
const I = {
  home: '<path d="M4 11.2 12 4.5l8 6.7V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.2h-6v5.2H5.5A1.5 1.5 0 0 1 4 19z"/>',
  list: '<path d="M8 6.5h11M8 12h11M8 17.5h11"/><circle cx="4.5" cy="6.5" r=".9" fill="currentColor"/><circle cx="4.5" cy="12" r=".9" fill="currentColor"/><circle cx="4.5" cy="17.5" r=".9" fill="currentColor"/>',
  chart: '<path d="M4 19.5h16"/><path d="M7 16v-4.5M12 16V7.5M17 16v-7"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"/>',
  left: '<path d="m14.5 6-6 6 6 6"/>', right: '<path d="m9.5 6 6 6-6 6"/>',
  up: '<path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/>', down: '<path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/>'
};
const svg = (n, extra = '', sw = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[n]}</svg>`;

const TABS = [
  ['beranda', 'Beranda', 'home'], ['transaksi', 'Transaksi', 'list'], ['analisis', 'Analisis', 'chart'],
  ['rencana', 'Rencana', 'target'], ['pengaturan', 'Pengaturan', 'gear']
];
const WALLET_TYPES = [['cash', 'Tunai', '💵'], ['bank', 'Bank', '🏦'], ['ewallet', 'E-wallet', '📱']];
const wEmoji = t => (WALLET_TYPES.find(x => x[0] === t) || [0, 0, '👛'])[2];
const CAT_EMOJI = ['🍜', '☕', '🛒', '🛍️', '🚌', '⛽', '🏠', '💡', '📱', '🧾', '🎬', '🎮', '💊', '🏥', '📚', '🎓', '✈️', '🎁', '💼', '⭐', '💰', '🐶', '👶', '🧴', '🔧', '✨'];

/* ---------- state UI ---------- */
const nowKey = () => ymd().slice(0, 7);
const state = { plan: 'goal', persisted: null, installed: matchMedia('(display-mode: standalone)').matches, firstPaint: true, month: nowKey() };
let deferredInstall = null;
const tabNow = () => { const h = (location.hash || '').replace(/^#\/?/, ''); return TABS.some(t => t[0] === h) ? h : 'beranda'; };

/* ---------- tema ---------- */
function applyTheme() {
  const t = db.settings.theme, el = document.documentElement;
  if (t === 'light' || t === 'dark') el.dataset.theme = t; else delete el.dataset.theme;
  requestAnimationFrame(() => {
    const m = $('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.body).backgroundColor;
  });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => db.settings.theme === 'auto' && applyTheme());

/* ---------- hitungan ---------- */
const wallet = id => db.wallets.find(w => w.id === id);
const category = id => db.categories.find(c => c.id === id);
const amt = t => Number(t.amount) || 0;
const cmpTx = (a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0) || String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
function balances() {
  const m = new Map(db.wallets.map(w => [w.id, Number(w.openingBalance) || 0]));
  const add = (id, v) => { if (m.has(id)) m.set(id, m.get(id) + v); };
  for (const t of db.transactions) {
    const a = amt(t);
    if (t.type === 'in') add(t.walletId, a);
    else if (t.type === 'out') add(t.walletId, -a);
    else if (t.type === 'transfer') { add(t.walletId, -a); add(t.toWalletId, a); }
  }
  return m;
}
function monthTotals(key) {
  let i = 0, o = 0;
  for (const t of db.transactions) if (String(t.date).startsWith(key)) { if (t.type === 'in') i += amt(t); else if (t.type === 'out') o += amt(t); }
  return { i, o };
}
function shiftMonth(key, d) {
  const [y, m] = key.split('-').map(Number), dt = new Date(y, m - 1 + d, 1);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
}
const monthLabel = key => { const [y, m] = key.split('-').map(Number); return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 1)); };
function dayLabel(ds) {
  const [y, m, d] = ds.split('-').map(Number), dt = new Date(y, m - 1, d), t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const diff = Math.round((t0 - dt) / 864e5);
  if (diff === 0) return 'Hari ini'; if (diff === 1) return 'Kemarin';
  return new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long' }).format(dt);
}
const usedWallet = id => db.transactions.filter(t => t.walletId === id || t.toWalletId === id).length;
const usedCat = id => db.transactions.filter(t => t.categoryId === id).length;


/* ---------- analisis & budget ---------- */
function monthCatTotals(key) {
  const m = new Map();
  for (const t of db.transactions) if (t.type === 'out' && String(t.date).startsWith(key)) m.set(t.categoryId, (m.get(t.categoryId) || 0) + amt(t));
  return m;
}
function trendData(key, n = 6) {
  const out = [];
  for (let k = n - 1; k >= 0; k--) { const mk = shiftMonth(key, -k), t = monthTotals(mk); out.push({ key: mk, i: t.i, o: t.o }); }
  return out;
}
const compact = n => n >= 1e9 ? `${nf1.format(n / 1e9)} M` : n >= 1e6 ? `${nf1.format(n / 1e6)} jt` : n >= 1e3 ? `${nf.format(n / 1e3)} rb` : String(n);
function niceTop(max) {
  if (max <= 0) return 1;
  const pow = 10 ** Math.floor(Math.log10(max)), f = max / pow;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow;
}
const shortMonth = key => { const [y, m] = key.split('-').map(Number); return new Intl.DateTimeFormat('id-ID', { month: 'short' }).format(new Date(y, m - 1, 1)).replace('.', ''); };
function budgetRows(key) {
  const spent = monthCatTotals(key);
  return db.budgets.map(b => {
    const c = category(b.categoryId); if (!c) return null;
    const limit = Number(b.limit) || 0, s = spent.get(b.categoryId) || 0, pct = limit > 0 ? s / limit : 0;
    return { b, c, limit, spent: s, pct, status: pct > 1 ? 'bad' : pct >= 0.8 ? 'warn' : 'ok' };
  }).filter(Boolean).sort((a, b) => b.pct - a.pct);
}
function meter(r) {
  const label = r.status === 'bad' ? `<b aria-hidden="true">×</b>Melebihi ${rupiah(r.spent - r.limit)}`
    : r.status === 'warn' ? `<b aria-hidden="true">!</b>Hampir habis, sisa ${rupiah(r.limit - r.spent)}`
    : `<b aria-hidden="true">✓</b>Sisa ${rupiah(r.limit - r.spent)}`;
  const w = Math.min(100, Math.round(r.pct * 100));
  return `<div class="mt ${r.status}"><div class="mt-h"><span class="rk-n"><span aria-hidden="true">${esc(r.c.icon)}</span>${esc(r.c.name)}</span><span class="rk-v">${rupiah(r.spent)} <small>/ ${rupiah(r.limit)}</small></span></div>
    <div class="mt-b" role="img" aria-label="${esc(r.c.name)}: ${Math.round(r.pct * 100)} persen dari budget"><i style="width:${w}%"></i></div><p class="mt-s">${label}</p></div>`;
}
function budgetAlert(catId, key) {
  const r = budgetRows(key).find(x => x.b.categoryId === catId); if (!r) return null;
  if (r.status === 'bad') return `Budget ${r.c.name} sudah terlewati`;
  if (r.status === 'warn') return `Budget ${r.c.name} hampir habis (${Math.round(r.pct * 100)}%)`;
  return null;
}
function barPath(x, y, w, h, r = 4) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function trendChart(key) {
  const data = trendData(key), W = 340, H = 170, L = 38, B = 24, T = 8, top = niceTop(Math.max(...data.flatMap(d => [d.i, d.o])));
  const ph = H - B - T, gw = (W - L - 4) / data.length, bw = Math.min(14, gw / 3);
  const y = v => T + ph - (v / top) * ph;
  const ticks = [0, top / 2, top];
  let g = ticks.map(v => `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`).join('');
  data.forEach((d, idx) => {
    const x0 = L + idx * gw, cx = x0 + gw / 2, sel = d.key === key;
    if (sel) g += `<rect class="hl" x="${x0 + 2}" y="${T - 4}" width="${gw - 4}" height="${ph + 8}" rx="10"/>`;
    g += `<path class="b-in" d="${barPath(cx - bw - 1, y(d.i), bw, T + ph - y(d.i))}"/><path class="b-out" d="${barPath(cx + 1, y(d.o), bw, T + ph - y(d.o))}"/>`;
    g += `<text class="${sel ? 'sel' : ''}" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(shortMonth(d.key))}</text>`;
    g += `<rect class="hit" data-a="trend-month" data-v="${d.key}" x="${x0}" y="0" width="${gw}" height="${H}"><title>${esc(monthLabel(d.key))}</title></rect>`;
  });
  const sel = data.find(d => d.key === key);
  const rows = data.map(d => `<tr><td>${esc(monthLabel(d.key))}</td><td>${rupiah(d.i)}</td><td>${rupiah(d.o)}</td></tr>`).join('');
  return `<div class="legend" aria-hidden="true"><span><i class="sw in"></i>Masuk</span><span><i class="sw out"></i>Keluar</span></div>
    <svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir. Ketuk bulan untuk memilihnya.">${g}</svg>
    <p class="readout">${esc(monthLabel(key))} <span>· Masuk</span> ${rupiah(sel.i)} <span>· Keluar</span> ${rupiah(sel.o)}</p>
    <details class="tbl"><summary>Lihat sebagai tabel</summary><table><thead><tr><th>Bulan</th><th>Masuk</th><th>Keluar</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}
function rankedCats(key) {
  const tot = monthCatTotals(key);
  let list = [...tot.entries()].map(([id, v]) => ({ c: category(id), v })).sort((a, b) => b.v - a.v);
  const sum = list.reduce((s, x) => s + x.v, 0); if (!sum) return '';
  if (list.length > 6) { const rest = list.slice(5), rv = rest.reduce((s, x) => s + x.v, 0); list = list.slice(0, 5).concat([{ c: { icon: '✨', name: `Lainnya (${rest.length} kategori)` }, v: rv }]); }
  const max = list[0].v;
  return list.map(x => `<div class="rk"><div class="rk-h"><span class="rk-n"><span aria-hidden="true">${esc(x.c ? x.c.icon : '❔')}</span>${esc(x.c ? x.c.name : 'Tanpa kategori')}</span><span class="rk-v">${rupiah(x.v)}<small>${Math.round(x.v / sum * 100)}%</small></span></div><div class="rk-b"><i style="width:${Math.max(2, x.v / max * 100)}%"></i></div></div>`).join('');
}
function budgetHome() {
  const rows = budgetRows(nowKey()).slice(0, 3); if (!rows.length) return '';
  return `<section class="sec"><div class="sec-head"><h2>Budget bulan ini</h2><a class="meta lnk" href="#/analisis">Lihat semua</a></div><div class="panel">${rows.map(meter).join('')}</div></section>`;
}

/* ---------- tampilan ---------- */
const SOON = '<span class="soon">Segera hadir</span>';
const empty = (emoji, tone, title, text, cta = SOON) =>
  `<div class="empty"><div class="eb" style="background:var(--${tone})">${emoji}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${cta}</div>`;
const heroSizeClass = s => s.length > 13 ? 'sm' : s.length > 9 ? 'md' : '';

function txRow(t) {
  const isT = t.type === 'transfer', c = category(t.categoryId), w = wallet(t.walletId), w2 = wallet(t.toWalletId);
  const icon = isT ? '🔄' : (c ? c.icon : '❔'), title = isT ? 'Transfer' : (c ? c.name : 'Tanpa kategori');
  const wn = w ? w.name : 'Dompet dihapus';
  let sub = isT ? `${wn} → ${w2 ? w2.name : 'Dompet dihapus'}` : wn;
  if (t.note) sub += ` · ${t.note}`;
  const cls = isT ? 'tr' : t.type, sign = t.type === 'in' ? '+' : t.type === 'out' ? '−' : '';
  return `<button class="tx" data-a="tx-edit" data-id="${esc(t.id)}"><span class="ti t-${cls}" aria-hidden="true">${esc(icon)}</span><span class="tm"><span class="tn">${esc(title)}</span><span class="ts">${esc(sub)}</span></span><span class="ta ${isT ? '' : t.type}">${sign}${rupiah(amt(t))}</span></button>`;
}
const flowCards = (i, o) => `<section class="flow" aria-label="Arus bulan ini">
  <div class="fc in"><div class="fi">${svg('down', '', 2.4)}</div><p class="fk">Pemasukan</p><p class="fv">${rupiah(i)}</p></div>
  <div class="fc out"><div class="fi">${svg('up', '', 2.4)}</div><p class="fk">Pengeluaran</p><p class="fv">${rupiah(o)}</p></div></section>`;

function walletCards(bal) {
  return `<div class="wr">${db.wallets.map(w =>
    `<button class="wc" data-a="wallet-edit" data-id="${esc(w.id)}"><span class="wi" aria-hidden="true">${wEmoji(w.type)}</span><span><span class="wn">${esc(w.name || 'Dompet')}</span><span class="wb">${rupiah(bal.get(w.id))}</span></span></button>`).join('')}
    <button class="wc add" data-a="wallet-add" aria-label="Tambah dompet"><span class="plus" aria-hidden="true">+</span><span>Dompet</span></button></div>`;
}

function viewBeranda() {
  const h = new Date().getHours();
  const hi = h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
  const date = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());

/* ---------- sheet & toast ---------- */
const wrap = $('#sheetWrap'), sheetEl = $('#sheet'), bodyEl = $('#sheetBody'), toastEl = $('#toast');
let sheetResolve = null, lastFocus = null, toastT = 0, toastFn = null, sheetPushed = false;

function openSheet(html) {
  toastEl.classList.remove('show');
  lastFocus = document.activeElement; bodyEl.innerHTML = html; wrap.hidden = false;
  document.body.classList.add('lock');
  if (!sheetPushed) { try { history.pushState({ sheet: 1 }, ''); sheetPushed = true; } catch (e) {} }
  requestAnimationFrame(() => { wrap.classList.add('open'); sheetEl.focus({ preventScroll: true }); });
}
function setSheet(html) { if (wrap.hidden) openSheet(html); else bodyEl.innerHTML = html; }
function closeSheet(result, viaPop) {
  wrap.classList.remove('open'); document.body.classList.remove('lock');
  const r = sheetResolve; sheetResolve = null;
  setTimeout(() => { if (!wrap.classList.contains('open')) wrap.hidden = true; }, 300);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  if (sheetPushed) { sheetPushed = false; if (!viaPop) { try { history.back(); } catch (e) {} } }
  if (r) r(result);
}
addEventListener('popstate', () => { if (!wrap.hidden && wrap.classList.contains('open')) closeSheet(false, true); });
function ask({ title, message, ok = 'Lanjut', cancel = 'Batal', danger = false }) {
  return new Promise(res => {
    sheetResolve = res;
    openSheet(`<h2 id="sheet-title">${esc(title)}</h2><div class="sheet-msg">${message}</div>
      <div class="sheet-actions"><button class="btn" data-a="sheet-no">${esc(cancel)}</button>
      <button class="btn ${danger ? 'danger-fill' : 'primary'}" data-a="sheet-ok">${esc(ok)}</button></div>`);
  });
}
function toast(msg, act) {
  clearTimeout(toastT); toastFn = act ? act.fn : null;
  toastEl.innerHTML = `<span>${esc(msg)}</span>${act ? `<button data-a="toast-act">${esc(act.label)}</button>` : ''}`;
  toastEl.classList.add('show');
  toastT = setTimeout(() => toastEl.classList.remove('show'), act ? 6500 : 3400);
}

  ${formActions(!!f.id)}`;
}
function openTx(id) {
  if (!db.wallets.length) return openWallet(null, 'Buat dompet pertamamu dulu, lalu kamu bisa mulai mencatat.');
  const t = id ? db.transactions.find(x => x.id === id) : null; if (id && !t) return;
  const last = db.settings.lastWalletId && wallet(db.settings.lastWalletId) ? db.settings.lastWalletId : db.wallets[0].id;
  resetForm({ kind: 'tx', id: t ? t.id : null, type: t ? t.type : 'out', amount: t ? amt(t) : 0,
    walletId: t && wallet(t.walletId) ? t.walletId : last, toWalletId: (t && t.toWalletId) || '', categoryId: (t && t.categoryId) || '',
    date: t ? t.date : ymd(), note: (t && t.note) || '' });
  setSheet(txFormHTML());
  if (!t) setTimeout(() => { const el = $('#f-amount'); if (el) el.focus(); }, 380);
}
function saveTx() {
  const f = form;
  if (!(f.amount > 0)) return setErr('Isi nominal dulu.');
  if (f.type !== 'transfer' && !f.categoryId) return setErr('Pilih kategori dulu.');
  if (f.type === 'transfer') {
    if (db.wallets.length < 2) return setErr('Transfer butuh minimal 2 dompet.');
    if (!f.toWalletId || f.toWalletId === f.walletId) return setErr('Pilih dompet tujuan yang berbeda.');
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return setErr('Isi tanggal dulu.');
  const rec = { type: f.type, amount: f.amount, walletId: f.walletId, date: f.date, note: f.note.trim() };
  if (f.type === 'transfer') rec.toWalletId = f.toWalletId; else rec.categoryId = f.categoryId;
  commit(d => {
    if (f.id) {
      const i = d.transactions.findIndex(x => x.id === f.id);
      if (i >= 0) { const old = d.transactions[i]; d.transactions[i] = Object.assign({ id: old.id, createdAt: old.createdAt }, rec); }
    } else d.transactions.push(Object.assign({ id: uid(), createdAt: nowISO() }, rec));
    d.settings.lastWalletId = f.walletId;
  });
  if (tabNow() === 'transaksi') state.month = f.date.slice(0, 7);
  let msg = f.id ? 'Perubahan disimpan' : 'Transaksi tersimpan';
  if (f.type === 'out') { const al = budgetAlert(f.categoryId, f.date.slice(0, 7)); if (al) msg = al; }
  finishForm(msg);
}

      `<button class="tx" data-a="cat-edit" data-id="${esc(c.id)}"><span class="ti t-${type}" aria-hidden="true">${esc(c.icon)}</span><span class="tm"><span class="tn">${esc(c.name)}</span><span class="ts">${usedCat(c.id)} transaksi</span></span></button>`).join('')}</div>` : '<p class="hint">Belum ada.</p>'}</div>`;
  };
  setSheet(`<h2 id="sheet-title">Kategori</h2>${grp('out', 'Pengeluaran')}${grp('in', 'Pemasukan')}
    <div class="sheet-actions"><button class="btn" data-a="sheet-no">Selesai</button><button class="btn primary" data-a="cat-add">Tambah kategori</button></div>`);
}


/* -- budget -- */
function budgetFormHTML() {
  const f = form, c = category(f.categoryId);
  return `<h2 id="sheet-title">Budget ${esc(c ? c.name : '')}</h2>
  <p class="hint">Batas pengeluaran per bulan untuk kategori ini. Berlaku setiap bulan.</p>
  <div class="fld"><label for="f-limit">Batas per bulan</label><div class="amt"><b>Rp</b><input id="f-limit" inputmode="numeric" autocomplete="off" placeholder="0" value="${f.limit ? nf.format(f.limit) : ''}"></div></div>
  ${formActions(!!f.id)}`;
}
function openBudget(catId) {
  const c = category(catId); if (!c) return;
  const b = db.budgets.find(x => x.categoryId === catId);
  resetForm({ kind: 'budget', id: b ? b.id : null, categoryId: catId, limit: b ? Number(b.limit) || 0 : 0, returnTo: 'budgetlist' });
  setSheet(budgetFormHTML());
  if (!b) setTimeout(() => { const el = $('#f-limit'); if (el) el.focus(); }, 380);
}
function saveBudget() {
  const f = form;
  if (!(f.limit > 0)) return setErr('Isi batas per bulan dulu.');
  commit(d => {
    if (f.id) { const b = d.budgets.find(x => x.id === f.id); if (b) b.limit = f.limit; }
    else d.budgets.push({ id: uid(), categoryId: f.categoryId, limit: f.limit });
  });
  finishForm('Budget disimpan');
}
function showBudgetList() {
  resetForm({ kind: 'budgetlist' });
  const cats = db.categories.filter(c => c.type === 'out');
  setSheet(`<h2 id="sheet-title">Atur budget</h2><p class="hint">Pilih kategori pengeluaran untuk menetapkan batas bulanannya.</p>
    <div class="fld"><div class="txl">${cats.map(c => {
      const b = db.budgets.find(x => x.categoryId === c.id);
      return `<button class="tx" data-a="budget-edit" data-id="${esc(c.id)}"><span class="ti t-out" aria-hidden="true">${esc(c.icon)}</span><span class="tm"><span class="tn">${esc(c.name)}</span><span class="ts">${b ? 'Batas ' + rupiah(b.limit) + ' per bulan' : 'Belum diatur'}</span></span><span class="ta">${b ? 'Ubah' : '+ Atur'}</span></button>`;
    }).join('')}</div></div>
    <div class="sheet-actions"><button class="btn primary" data-a="sheet-no">Selesai</button></div>`);
}

/* -- bersama -- */
function finishForm(msg) {
  if (form.returnTo === 'catlist') showCatList(); else if (form.returnTo === 'budgetlist') showBudgetList(); else closeSheet(false);
  render(); toast(msg);
}
function removeItem(list, id, msg) {
  const arr = db[list], i = arr.findIndex(x => x.id === id); if (i < 0) return;
  const back = form.returnTo, [item] = arr.splice(i, 1);
  db.meta.updatedAt = nowISO(); persist();
  if (back === 'catlist') showCatList(); else if (back === 'budgetlist') showBudgetList(); else closeSheet(false);
  render();
  toast(msg, { label: 'Urungkan', fn: () => { commit(d => { d[list].splice(Math.min(i, d[list].length), 0, item); }); render(); } });
}
function saveForm() { if (form.kind === 'tx') saveTx(); else if (form.kind === 'wallet') saveWallet(); else if (form.kind === 'cat') saveCat(); else if (form.kind === 'budget') saveBudget(); }
function deleteForm() {
  const f = form;
  if (f.kind === 'tx') return removeItem('transactions', f.id, 'Transaksi dihapus');
  if (f.kind === 'wallet') { const n = usedWallet(f.id); if (n) return setErr(`Dompet ini dipakai di ${n} transaksi, jadi belum bisa dihapus.`); return removeItem('wallets', f.id, 'Dompet dihapus'); }
  if (f.kind === 'budget') return removeItem('budgets', f.id, 'Budget dihapus');
  if (f.kind === 'cat') { const n = usedCat(f.id); if (n) return setErr(`Kategori ini dipakai di ${n} transaksi, jadi belum bisa dihapus.`); if (db.budgets.some(b => b.categoryId === f.id)) return setErr('Kategori ini punya budget. Hapus budgetnya dulu.'); return removeItem('categories', f.id, 'Kategori dihapus'); }
}

/* ---------- aksi data ---------- */
function keepPrev() { lsSet(PREV, JSON.stringify(db)); }
function undo() {
  const raw = lsGet(PREV); if (!raw) return toast('Tidak ada yang bisa diurungkan');
  try { db = normalize(JSON.parse(raw)); persist(); applyTheme(); render(); toast('Dikembalikan seperti semula'); }
  catch (e) { toast('Gagal mengurungkan'); }
}
function exportData() {
  commit(d => { d.meta.lastBackupAt = nowISO(); });
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `kasku-cadangan-${ymd()}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  render(); toast('Cadangan diunduh. Cek folder Unduhan.');
}
async function importFile(f) {
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) return toast('File terlalu besar untuk cadangan Kasku.');
  let data; try { data = JSON.parse(await f.text()); } catch (e) { return toast('File tidak bisa dibaca. Pastikan ini file cadangan .json.'); }
  const err = validate(data); if (err) return toast(err);
  const c = counts(data);
  const ok = await ask({
    title: 'Ganti data dengan cadangan ini?',
    message: `<p>Cadangan berisi ${c.wallets} dompet, ${c.transactions} transaksi, ${c.budgets} budget, ${c.goals} goal, dan ${c.debts} hutang.</p><p>Data yang ada sekarang akan diganti. Kamu masih bisa mengurungkannya sesaat setelahnya.</p>`,
    ok: 'Ganti data'
  });
  if (!ok) return;
  keepPrev(); db = normalize(data); persist(); applyTheme(); render();
  toast('Cadangan dipulihkan', { label: 'Urungkan', fn: undo });
}
async function resetAll() {
  const ok = await ask({
    title: 'Hapus semua data?',
    message: '<p>Semua dompet, transaksi, budget, goal, dan hutang di perangkat ini akan dihapus.</p><p>Ekspor cadangan dulu jika kamu masih membutuhkannya.</p>',
    ok: 'Hapus semua', danger: true
  });
  if (!ok) return;
  keepPrev(); db = fresh(); persist(); applyTheme(); render();
  toast('Semua data dihapus', { label: 'Urungkan', fn: undo });
}
async function installApp() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  try { await deferredInstall.userChoice; } catch (e) {}
  deferredInstall = null; render();
}
function requestPersist() {
  if (!navigator.storage || !navigator.storage.persist) return toast('Browser ini belum mendukung perlindungan data.');
  navigator.storage.persist().then(v => {
    state.persisted = v; render();
    toast(v ? 'Penyimpanan kini dilindungi' : 'Browser belum mengizinkan. Pasang aplikasi ke layar utama lalu coba lagi.');
  });
}

/* ---------- event ---------- */
document.addEventListener('click', e => {
  if (e.target === wrap) return closeSheet(false);
  const el = e.target.closest('[data-a]'); if (!el) return;
  const v = el.dataset.v, id = el.dataset.id;
  switch (el.dataset.a) {
    case 'add': openTx(); break;
    case 'tx-edit': openTx(id); break;
    case 'wallet-add': openWallet(); break;
    case 'wallet-edit': openWallet(id); break;
    case 'cat-list': showCatList(); break;
    case 'cat-add': openCat(null, 'catlist'); break;
    case 'cat-edit': openCat(id, 'catlist'); break;
    case 'budget-list': showBudgetList(); break;
    case 'budget-edit': openBudget(id); break;
    case 'trend-month': state.month = v; render(); break;
    case 'month': state.month = shiftMonth(state.month, Number(v)); render(); break;
    case 'plan': state.plan = v; render(); break;
    case 'theme': commit(d => { d.settings.theme = v; }); applyTheme(); render(); break;
    case 'f-type': form.type = v; form.categoryId = ''; form.toWalletId = ''; showForm(); break;
    case 'f-cat': form.categoryId = v; showForm(); break;
    case 'f-wallet': form.walletId = v; if (form.toWalletId === v) form.toWalletId = ''; showForm(); break;
    case 'f-to': form.toWalletId = v; showForm(); break;
    case 'f-wtype': form.wtype = v; showForm(); break;
    case 'f-ctype': form.ctype = v; showForm(); break;
    case 'f-emoji': form.icon = v; showForm(); break;
    case 'f-save': saveForm(); break;
    case 'f-del': deleteForm(); break;
    case 'export': exportData(); break;
    case 'import': $('#file').click(); break;
    case 'reset': resetAll(); break;
    case 'install': installApp(); break;
    case 'persist': requestPersist(); break;
    case 'sheet-ok': closeSheet(true); break;
    case 'sheet-no': closeSheet(false); break;
    case 'toast-act': toastEl.classList.remove('show'); if (toastFn) toastFn(); break;
  }
});
const onInput = e => {
  const t = e.target, id = t.id;
  if (id === 'f-amount' || id === 'f-open' || id === 'f-limit') {
    const digits = t.value.replace(/\D/g, '').slice(0, 12), n = digits ? Number(digits) : 0;
    t.value = digits ? nf.format(n) : ''; form[id === 'f-amount' ? 'amount' : id === 'f-limit' ? 'limit' : 'opening'] = n;
  } else if (id === 'f-note') form.note = t.value;
  else if (id === 'f-date') form.date = t.value;
  else if (id === 'f-name') form.name = t.value;
};
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !wrap.hidden) closeSheet(false);
  else if (e.key === 'Enter' && ['f-note', 'f-name', 'f-amount', 'f-open', 'f-limit'].includes(e.target.id)) { e.preventDefault(); saveForm(); }
});
$('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); });
addEventListener('hashchange', render);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (tabNow() === 'pengaturan') render(); });
addEventListener('appinstalled', () => { deferredInstall = null; state.installed = true; render(); toast('Kasku terpasang di layar utama'); });
addEventListener('storage', e => { if (e.key === KEY) { db = load(); applyTheme(); render(); } });

/* ---------- mulai ---------- */
applyTheme(); render();
if (navigator.storage && navigator.storage.persisted) {
  navigator.storage.persisted().then(async p => {
    if (!p && navigator.storage.persist) { try { p = await navigator.storage.persist(); } catch (e) {} }
    state.persisted = p; if (tabNow() === 'pengaturan') render();
  });
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
